# 召回评测金标：每篇 5 条关键结论，独立于抽取结果编写
# 由 agent 依据摘要起草，待人工确认
question: 阿司匹林的作用机制、疗效与安全性关键结论

articles:
  - pmid: "35768902"
    note: 低剂量阿司匹林与体重/BMI
    claims:
      - id: R1
        text: 在无糖尿病的健康成人中，低剂量阿司匹林对血小板聚集的抑制程度与 BMI、体重无关。
      - id: R2
        text: NYU 队列（n=84）每日 81mg 非肠溶阿司匹林 1 周后，ADP 与花生四烯酸诱导的血小板聚集受到抑制。
      - id: R3
        text: Duke 验证队列（n=66）随机接受 81mg 或 325mg，两种剂量对血小板聚集的抑制程度相似。
      - id: R4
        text: 阿司匹林对直接和间接 COX1 介导的血小板聚集均产生强效抑制。
      - id: R5
        text: 作者推测，体重增加降低低剂量阿司匹林预防效力，可能由其他机制解释。

  - pmid: "30158069"
    note: ARRIVE 一级预防 RCT
    claims:
      - id: A1
        kind: method
        text: ARRIVE 纳入 12546 名中等心血管风险、无糖尿病且非高出血风险的患者。
      - id: A2
        text: 主要复合终点（心血管死亡、心梗、不稳定心绞痛、卒中或 TIA）aspirin 4.29% vs 安慰剂 4.48%，HR 0.96，无显著差异。
      - id: A3
        text: 胃肠道出血 aspirin 0.97% vs 安慰剂 0.46%，HR 2.11，显著增加。
      - id: A4
        text: 严重不良事件与总体不良事件发生率在两组间相似。
      - id: A5
        text: 作者认为实际事件率远低于预期，研究更代表低风险人群，中等风险人群的问题未能回答。

  - pmid: "27846246"
    note: 致命性消化道出血 meta 分析
    claims:
      - id: G1
        text: 11 项随机试验的 meta 分析显示，低剂量阿司匹林导致“major”胃肠道出血的 RR 为 1.55。
      - id: G2
        text: 归因于阿司匹林的出血事件致死风险 RR 为 0.45。
      - id: G3
        text: 总体上，阿司匹林组致死性出血风险无显著增加（RR 0.77）。
      - id: G4
        text: 作者认为没有有效证据表明阿司匹林增加致命性胃肠道出血的总体频率。
      - id: G5
        text: 作者估计每 1000 人服用 10 年约有 1 例死亡和 1 例致残性卒中，主要实质风险是脑出血。

  - pmid: "28905988"
    note: 低剂量肠溶阿司匹林生物等效性
    claims:
      - id: B1
        kind: method
        text: 两种 75mg 肠溶阿司匹林（Caprin、Protek）与 Nu-Seals 75mg 比较，主要终点为 14 天后血清血栓烷水平。
      - id: B2
        text: Protek 未达到生物等效，显著弱于 Nu-Seals。
      - id: B3
        text: Caprin 未达到生物等效，但更强，因此获得批准。
      - id: B4
        text: 75mg 普通阿司匹林比 Nu-Seals 更有效地抑制血清血栓烷生成。
      - id: B5
        text: 低剂量阿司匹林制剂抑制血清血栓烷的能力存在显著差异。
